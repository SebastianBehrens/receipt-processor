<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Receipt Processor</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-200 flex items-center justify-center">
    <div class="card w-96 bg-base-100 shadow-xl">
        <div class="card-body">
            <h2 class="card-title justify-center mb-6">Receipt Processor</h2>
            
            <div class="alert alert-info">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>Authentication is handled by Authelia. You should be automatically logged in.</span>
            </div>
            
            <div class="form-control mt-6">
                <a href="/" class="btn btn-primary">Continue to Application</a>
            </div>
            
            <div class="divider">OR</div>
            
            <div class="text-center text-sm">
                <p class="text-base-content/60">
                    If you're not automatically authenticated, please contact your administrator.
                </p>
                <p class="text-base-content/60 mt-2">
                    Supported users: sebastian, iva
                </p>
            </div>
        </div>
    </div>
</body>
</html>
