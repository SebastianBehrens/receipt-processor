<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HTMX Receipt Processor{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧾</text></svg>">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.6.0/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    {% csrf_token %}
    
    <!-- Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <style>
        /* Custom theme colors inspired by example_proj */
        :root {
            --color-primary: #3b82f6;
            --color-primary-content: #ffffff;
            --color-base-100: #ffffff;
            --color-base-200: #f8fafc;
            --color-base-300: #e2e8f0;
            --color-base-content: #1e293b;
        }
        
        [data-theme="dark"] {
            --color-primary: #60a5fa;
            --color-primary-content: #1e293b;
            --color-base-100: #0f172a;
            --color-base-200: #1e293b;
            --color-base-300: #334155;
            --color-base-content: #f1f5f9;
        }

        /* Prevent layout shift when pages differ in height (scrollbar toggle) */
        html {
            scrollbar-gutter: stable;
        }

        /* Responsive container improvements */
        .app-container {
            width: 100%;
            max-width: 100%;
            padding: 0.5rem;
            box-sizing: border-box;
        }
        
        /* On larger screens, use contained width */
        @media (min-width: 1024px) {
            .app-container {
                max-width: 1200px;
                margin: 0 auto;
                padding: 1rem;
            }
        }
        
        @media (min-width: 1440px) {
            .app-container {
                max-width: 1400px;
                padding: 1.5rem;
            }
        }
        
        /* Ensure full height usage */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        
        /* Better mobile spacing */
        @media (max-width: 768px) {
            .card-body {
                padding: 1rem;
            }
            
            .gap-6 {
                gap: 1rem;
            }
        }

        /* Layering: navbar/dropdowns/toasts above wizard cards and steps */
        .app-navbar {
            width: 100%;
            box-sizing: border-box;
        }

        .navbar {
            isolation: isolate;
        }

        .navbar-end {
            flex-shrink: 0;
        }

        .navbar-toolbar {
            width: 7.5rem;
            min-width: 7.5rem;
            justify-content: flex-end;
        }

        .dropdown-content {
            z-index: 100;
        }

        .toast {
            z-index: 9999;
            position: fixed;
        }

        .wizard-steps {
            position: relative;
            z-index: 0;
        }

        #main-content {
            position: relative;
            z-index: 0;
        }

        .navbar-toolbar .btn-square {
            padding: 0;
        }

        .navbar-toolbar .dropdown-content.menu li button {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
        }
    </style>
</head>
<body class="antialiased min-h-screen bg-base-100">
    {% block toasts %}{% endblock %}
    <div class="app-container main-content">
        {% block content %}{% endblock %}
    </div>
    
    <!-- Global Theme Initialization Script -->
    <script>
        // CSRF token is sent as a "csrfmiddlewaretoken" body value (via hx-vals /
        // form fields), not as an X-CSRFToken header, because the reverse proxy
        // in front of this app strips all "X-*" request headers as part of its
        // Authelia forward-auth config (authResponseHeadersRegex: '^X-').
        document.body.addEventListener('htmx:configRequest', (event) => {
            if (!event.detail.parameters.csrfmiddlewaretoken) {
                const tokenInput = document.querySelector('[name=csrfmiddlewaretoken]');
                if (tokenInput) {
                    event.detail.parameters.csrfmiddlewaretoken = tokenInput.value;
                }
            }
        });

        // Initialize theme on page load
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
        });
        
        function toggleDarkMode() {
            const htmlElement = document.documentElement;
            const currentTheme = htmlElement.getAttribute('data-theme') || 'light';
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            const themeIcon = document.getElementById('theme-icon');

            htmlElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);

            if (themeIcon) {
                themeIcon.textContent = newTheme === 'dark' ? 'light_mode' : 'dark_mode';
            }
        }
    </script>
</body>
</html>
