<!-- Aggregate Template -->
<div class="card-body">
    <div class="flex justify-center items-center h-full">
        <div class="text-center w-[85%]">
            <h2 class="text-2xl font-bold text-base-content mb-6">Spending Summary</h2>
            <p class="text-base-content/60 mb-8">Your receipt processing is complete. Here's the breakdown:</p>

            {% include "partials/aggregation_summary.html" with state=state %}

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <button class="btn btn-outline btn-lg"
                        hx-post="/core/restart/"
                        hx-target="body"
                        hx-swap="innerHTML"
                        hx-vals='{"csrfmiddlewaretoken": "{{ csrf_token }}"}'>
                    <span class="material-symbols-rounded text-xl">arrow_back</span>
                    Back to sessions
                </button>
            </div>
        </div>
    </div>
</div>
