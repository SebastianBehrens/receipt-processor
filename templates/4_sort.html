<!-- Sort Template -->
<div class="card-body h-full flex flex-col">
    <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-base-content mb-2">Sort Items</h2>
        <p class="text-base-content/60 mb-4">Assign each item to the correct person</p>
    </div>

    <div class="flex-1 flex flex-col justify-start items-center">
        <div class="w-full max-w-md mb-4">
            <progress id="sorting-progress" class="progress progress-primary w-full"
                      value="{{ sort_display.progress_percentage|default:0 }}" max="100"></progress>
            <div class="text-center mt-2">
                <span class="text-sm text-base-content/60">
                    Item <span id="current-item-number">{{ sort_display.current_number|default:0 }}</span>
                    of <span id="total-items-number">{{ sort_display.total_items|default:0 }}</span>
                </span>
            </div>
        </div>

        <div class="w-full max-w-md mb-8">
            <div id="current-item-display" class="card bg-base-300 border-2 border-primary/20 p-8 text-center min-h-[10rem] flex items-center justify-center"
                 {% if not sort_display %}
                 hx-get="/core/get-current-item/"
                 hx-trigger="load"
                 hx-target="this"
                 hx-swap="innerHTML"
                 {% endif %}>
                {% if sort_display %}
                    {% include "partials/sort_current_item.html" with sort_display=sort_display %}
                {% else %}
                    <div>
                        <div class="loading loading-spinner loading-lg mx-auto"></div>
                        <p class="text-base-content/60 mt-4">Loading item...</p>
                    </div>
                {% endif %}
            </div>
        </div>

        <div id="assignment-buttons" class="flex flex-col sm:flex-row gap-4 justify-center items-center">
            <button id="sebastian-btn" class="btn btn-primary btn-lg min-w-32"
                    hx-post="/core/assign-item/"
                    hx-vals='{"assignee": "sebastian", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    {% if not sort_display %}disabled{% endif %}>
                <span class="material-symbols-rounded text-xl">person</span>
                Sebastian
            </button>

            <button id="both-btn" class="btn btn-accent btn-lg min-w-32"
                    hx-post="/core/assign-item/"
                    hx-vals='{"assignee": "both", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    {% if not sort_display %}disabled{% endif %}>
                <span class="material-symbols-rounded text-xl">group</span>
                50/50
            </button>

            <button id="iva-btn" class="btn btn-secondary btn-lg min-w-32"
                    hx-post="/core/assign-item/"
                    hx-vals='{"assignee": "iva", "csrfmiddlewaretoken": "{{ csrf_token }}"}'
                    hx-target="#main-content"
                    hx-swap="innerHTML"
                    {% if not sort_display %}disabled{% endif %}>
                <span class="material-symbols-rounded text-xl">person</span>
                Iva
            </button>
        </div>
    </div>
</div>
